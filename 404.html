<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>404 Page Not Found | Adams+</title>
    <meta name="description" content="The page you're looking for doesn't exist.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Focus styles for accessibility */
        a:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
            border-radius: 0.25rem;
        }
    </style>
</head>

<body class="h-full">
<main class="relative isolate min-h-full">
  <!-- Background image with dark overlay -->
  <div class="absolute inset-0 -z-10 size-full">
    <img 
      src="images/kamran-abdullayev-okkwqpKX2qw-unsplash.jpg" 
      alt="404 Background" 
      class="size-full object-cover object-top"
    />
    <div class="absolute inset-0 bg-black/50"></div>
  </div>
  
  <div class="mx-auto max-w-7xl px-6 py-32 text-center sm:py-40 lg:px-8">
    <p class="text-base font-semibold text-white">404</p>
    <h1 class="mt-4 text-5xl font-semibold tracking-tight text-balance text-white sm:text-7xl">Page not found</h1>
    <p class="mt-6 text-lg font-medium text-pretty text-white/70 sm:text-xl">Sorry, we couldn't find the page you're looking for.</p>
    <div class="mt-10 flex justify-center">
      <a href="/" class="text-sm font-semibold text-white hover:text-white/90 flex items-center gap-2">
        <span aria-hidden="true">&larr;</span> 
        Back to home
      </a>
    </div>
  </div>
</main>
</body>
</html>
