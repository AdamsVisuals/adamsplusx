<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Server Error | Adams+ Digital Solutions</title>
    <meta name="description" content="Server error - Adams+ Digital Solutions website is temporarily unavailable.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" content="Adams+ Digital Solutions">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Server Error | Adams+ Digital Solutions">
    <meta property="og:description" content="We're experiencing technical difficulties. Please try again shortly.">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Focus styles for accessibility */
        a:focus-visible, 
        button:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
            border-radius: 0.25rem;
        }
    </style>
</head>

<body class="h-full">
<main class="relative isolate min-h-full">
  <!-- Background image with dark overlay -->
  <div class="absolute inset-0 -z-10 size-full">
    <img 
      src="images/kamran-abdullayev-okkwqpKX2qw-unsplash.jpg" 
      alt="500 Server Error Background" 
      class="size-full object-cover object-top"
    />
    <div class="absolute inset-0 bg-black/60"></div>
  </div>
  
  <div class="mx-auto max-w-3xl px-6 py-32 text-center sm:py-40 lg:px-8">
    <p class="text-base font-semibold text-white">500</p>
    <h1 class="mt-4 text-5xl font-semibold tracking-tight text-balance text-white sm:text-7xl">Server Error</h1>
    <p class="mt-6 text-lg font-medium text-pretty text-white/80 sm:text-xl">
      We're experiencing technical difficulties. Our team has been notified and is working to resolve the issue.
    </p>
    
    <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
      <button 
        onclick="location.reload()" 
        class="bg-white text-gray-900 px-6 py-3 rounded-lg font-semibold hover:bg-gray-100 transition-colors duration-200 flex items-center justify-center gap-2"
      >
        <i class="fas fa-redo"></i>
        Try Again
      </button>
      
      <a 
        href="/" 
        class="border border-white text-white px-6 py-3 rounded-lg font-semibold hover:bg-white/10 transition-colors duration-200 flex items-center justify-center gap-2"
      >
        <i class="fas fa-home"></i>
        Back to Home
      </a>
    </div>
    
    <div class="mt-12 pt-8 border-t border-white/20">
      <p class="text-sm text-white/70 mb-4">Need immediate assistance?</p>
      <div class="flex flex-wrap justify-center gap-6">
        <a href="mailto:hello@adamsplusx.com" class="text-sm text-white hover:text-white/90 font-medium flex items-center gap-2">
          <i class="fas fa-envelope"></i>
          Email Us
        </a>
        <a href="tel:+255746692640" class="text-sm text-white hover:text-white/90 font-medium flex items-center gap-2">
          <i class="fas fa-phone"></i>
          +255 746 692 640
        </a>
      </div>
    </div>
  </div>
</main>

<script>
    // Auto-refresh after 30 seconds
    setTimeout(() => {
        location.reload();
    }, 30000);
    
    // Cancel auto-refresh if user interacts
    document.addEventListener('click', () => {
        clearTimeout(window.refreshTimeout);
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        // R to refresh
        if (e.key === 'r' || e.key === 'R') {
            location.reload();
        }
        // Escape to go home
        if (e.key === 'Escape') {
            window.location.href = '/';
        }
    });
    
    // Simple console message
    console.log('Adams+ 500 Error - Our team is working on a fix.');
</script>

<script src="//code.tidio.co/4lbvsqqdlrambxryzwwvqdmdbs3njch9.js" async></script>
</body>
</html>
